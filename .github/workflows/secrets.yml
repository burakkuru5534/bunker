# Gizli değer taraması — SAFE-010
# Her push ve PR'da izlenen tüm dosyalarda bilinen gizli değer biçimlerini arar
# (backend/cmd/secretscan). Bulgu varsa iş başarısız olur; değerler loga yazılmaz.
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: secretscan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Gizli değer taraması
        run: go run ./cmd/secretscan